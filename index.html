<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>SafEnt Rental</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
background:radial-gradient(circle at bottom,#1a0033,#000);
}

/* stelle */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px,transparent 1px),
radial-gradient(white 1px,transparent 1px);
background-size:120px 120px,200px 200px;
opacity:0.3;
pointer-events:none;
}

/* header */

header{
background:#180030;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
color:#cfa8ff;
font-weight:bold;
}

nav button{
margin-left:8px;
}

/* layout */

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

/* sections */

.section{
display:none;
}

.active{
display:block;
}

/* cards */

.card{
background:#250050;
padding:20px;
margin-bottom:15px;
border-radius:10px;
}

/* inputs */

input,textarea{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:8px;
background:#1b0038;
color:white;
}

/* button */

button{
background:#7b2cff;
border:none;
color:white;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#a35cff;
}

/* chat */

.chatBox{
height:200px;
overflow:auto;
background:#15002d;
padding:10px;
border-radius:8px;
}

.msg{
background:#5000b0;
margin:5px 0;
padding:6px;
border-radius:6px;
}

</style>

</head>

<body>

<header>

<div class="logo">SafEnt Rental</div>

<nav>

<button onclick="showSection('home')">Home</button>
<button onclick="showSection('services')">Servizi</button>
<button onclick="showSection('publish')">Pubblica</button>
<button onclick="showSection('chat')">Chat</button>
<button onclick="showSection('account')">Account</button>

</nav>

</header>

<div class="container">

<!-- HOME -->

<div id="home" class="section active">

<div class="card">

<h2>Benvenuto su SafEnt Rental</h2>
<p>Piattaforma per affittare servizi.</p>

</div>

</div>

<!-- SERVICES -->

<div id="services" class="section">

<div class="card">

<h3>Servizi</h3>

<button onclick="loadServices()">Aggiorna</button>

<div id="servicesList"></div>

</div>

</div>

<!-- PUBLISH -->

<div id="publish" class="section">

<div class="card">

<h3>Pubblica servizio</h3>

<input id="title" placeholder="Titolo">

<textarea id="description" placeholder="Descrizione"></textarea>

<input id="price" placeholder="Prezzo">

<button onclick="createService()">Pubblica</button>

</div>

</div>

<!-- CHAT -->

<div id="chat" class="section">

<div class="card">

<h3>Chat</h3>

<div class="chatBox" id="chatBox"></div>

<input id="chatInput" placeholder="Messaggio">

<button onclick="sendMessage()">Invia</button>

</div>

</div>

<!-- ACCOUNT -->

<div id="account" class="section">

<div class="card">

<h3>Account</h3>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>

<p id="userStatus"></p>

</div>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"

import {
getFirestore,
collection,
addDoc,
getDocs,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"

/* CONFIG FIREBASE */

const firebaseConfig = {
apiKey: "AIzaSyCysFp0BlVGQF6jlyJCv5J8e8k1AjXFNQ4",
authDomain: "safent-rental.firebaseapp.com",
databaseURL: "https://safent-rental-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "safent-rental",
storageBucket: "safent-rental.firebasestorage.app",
messagingSenderId: "739442300132",
appId: "1:739442300132:web:cb5046398e0b4dc87c48f1",
measurementId: "G-3DC7JE7EB3"
}

const app = initializeApp(firebaseConfig)
const auth = getAuth(app)
const db = getFirestore(app)

/* MENU */

window.showSection = (id)=>{

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

/* REGISTER */

window.register = async ()=>{

const email = document.getElementById("email").value
const password = document.getElementById("password").value

try{

await createUserWithEmailAndPassword(auth,email,password)
alert("Account creato")

}catch(e){

alert(e.message)

}

}

/* LOGIN */

window.login = async ()=>{

const email = document.getElementById("email").value
const password = document.getElementById("password").value

try{

await signInWithEmailAndPassword(auth,email,password)
alert("Login effettuato")

}catch(e){

alert(e.message)

}

}

/* LOGOUT */

window.logout = ()=>signOut(auth)

/* USER STATUS */

onAuthStateChanged(auth,user=>{

if(user){
document.getElementById("userStatus").innerText="Loggato: "+user.email
}else{
document.getElementById("userStatus").innerText="Non loggato"
}

})

/* CREATE SERVICE */

window.createService = async ()=>{

if(!auth.currentUser){
alert("Devi fare login")
return
}

await addDoc(collection(db,"services"),{

title:document.getElementById("title").value,
description:document.getElementById("description").value,
price:document.getElementById("price").value,
user:auth.currentUser.uid

})

alert("Servizio pubblicato")

}

/* LOAD SERVICES */

window.loadServices = async ()=>{

const list = document.getElementById("servicesList")
list.innerHTML=""

const snap = await getDocs(collection(db,"services"))

snap.forEach(doc=>{

const s = doc.data()

const div=document.createElement("div")

div.className="card"

div.innerHTML=`
<h4>${s.title}</h4>
<p>${s.description}</p>
<p>${s.price} €</p>
`

list.appendChild(div)

})

}

/* CHAT */

window.sendMessage = async ()=>{

if(!auth.currentUser) return

const text=document.getElementById("chatInput").value

await addDoc(collection(db,"messages"),{

text:text,
user:auth.currentUser.uid,
time:Date.now()

})

document.getElementById("chatInput").value=""

}

/* CHAT REALTIME */

onSnapshot(collection(db,"messages"),snap=>{

const box=document.getElementById("chatBox")

box.innerHTML=""

snap.forEach(doc=>{

const m=doc.data()

const div=document.createElement("div")

div.className="msg"

div.innerText=m.text

box.appendChild(div)

})

})

</script>

</body>
</html>

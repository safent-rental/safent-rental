<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>SafEnt Rental</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
background:radial-gradient(circle at bottom,#1a0033,#000);
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px,transparent 1px),
radial-gradient(white 1px,transparent 1px);
background-size:120px 120px,200px 200px;
opacity:0.35;
pointer-events:none;
}

header{
background:#180030;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

nav button{
margin-left:10px;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.section{
display:none;
}

.active{
display:block;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#240048;
border-radius:12px;
overflow:hidden;
cursor:pointer;
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.cardContent{
padding:15px;
}

input,textarea{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:8px;
background:#1b0038;
color:white;
}

button{
background:#7a2cff;
border:none;
padding:10px 15px;
border-radius:8px;
color:white;
cursor:pointer;
}

.chatBox{
height:250px;
overflow:auto;
background:#120028;
padding:10px;
border-radius:8px;
}

.msg{
background:#5200b5;
padding:6px;
margin:5px 0;
border-radius:6px;
}

</style>

</head>

<body>

<header>

<h2>SafEnt Rental</h2>

<nav>

<button onclick="showSection('services')">Servizi</button>
<button onclick="showSection('publish')">Pubblica</button>
<button onclick="showSection('account')">Account</button>

</nav>

</header>

<div class="container">

<!-- SERVICES -->

<div id="services" class="section active">

<input id="search" placeholder="Cerca servizi..." onkeyup="searchServices()">

<div class="grid" id="servicesList"></div>

</div>

<!-- SERVICE PAGE -->

<div id="servicePage" class="section">

<h2 id="serviceTitle"></h2>

<img id="serviceImage" width="300">

<p id="serviceDesc"></p>

<p id="servicePrice"></p>

<button onclick="bookService()">📅 Prenota</button>

<h3>Chat venditore</h3>

<div class="chatBox" id="chatBox"></div>

<input id="chatInput">

<button onclick="sendMessage()">Invia</button>

</div>

<!-- PUBLISH -->

<div id="publish" class="section">

<h2>Pubblica servizio</h2>

<input id="title" placeholder="Titolo">

<textarea id="description" placeholder="Descrizione"></textarea>

<input id="price" placeholder="Prezzo">

<input id="location" placeholder="Città">

<input type="file" id="image">

<button onclick="createService()">Pubblica</button>

</div>

<!-- ACCOUNT -->

<div id="account" class="section">

<h2>Account</h2>

<input id="username" placeholder="Username">

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>

<button onclick="login()">Login</button>

<button onclick="logout()">Logout</button>

<p id="userStatus"></p>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"

import { getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"

import { getFirestore,collection,addDoc,getDocs,onSnapshot }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"

const firebaseConfig = {
  apiKey: "AIzaSyCysFp0BlVGQF6jlyJCv5J8e8k1AjXFNQ4",
  authDomain: "safent-rental.firebaseapp.com",
  databaseURL: "https://safent-rental-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "safent-rental",
  storageBucket: "safent-rental.firebasestorage.app",
  messagingSenderId: "739442300132",
  appId: "1:739442300132:web:cb5046398e0b4dc87c48f1",
  measurementId: "G-3DC7JE7EB3"
}

const app=initializeApp(firebaseConfig)

const auth=getAuth(app)

const db=getFirestore(app)

let servicesCache=[]

let currentService=null

let currentUsername=""

/* MENU */

window.showSection=(id)=>{

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

/* REGISTER */

window.register=async()=>{

const cred=await createUserWithEmailAndPassword(auth,email.value,password.value)

await addDoc(collection(db,"users"),{

uid:cred.user.uid,
username:username.value,
email:email.value

})

currentUsername=username.value

}

/* LOGIN */

window.login=async()=>{

await signInWithEmailAndPassword(auth,email.value,password.value)

const snap=await getDocs(collection(db,"users"))

snap.forEach(doc=>{

const u=doc.data()

if(u.uid===auth.currentUser.uid){

currentUsername=u.username

}

})

}

window.logout=()=>signOut(auth)

onAuthStateChanged(auth,user=>{

userStatus.innerText=user?"Loggato":"Non loggato"

})

/* CREATE SERVICE */

window.createService=()=>{

const file=image.files[0]

const reader=new FileReader()

reader.onload=async()=>{

await addDoc(collection(db,"services"),{

title:title.value,
description:description.value,
price:price.value,
location:location.value,
image:reader.result,
owner:auth.currentUser.uid

})

loadServices()

}

reader.readAsDataURL(file)

}

/* LOAD SERVICES */

async function loadServices(){

servicesList.innerHTML=""

const snap=await getDocs(collection(db,"services"))

servicesCache=[]

snap.forEach(doc=>{

const s=doc.data()

s.id=doc.id

servicesCache.push(s)

createCard(s)

})

}

function createCard(s){

const card=document.createElement("div")

card.className="card"

card.innerHTML=`

<img src="${s.image}">

<div class="cardContent">

<h3>${s.title}</h3>

<p>${s.location}</p>

<p>${s.price} €</p>

</div>

`

card.onclick=()=>openService(s)

servicesList.appendChild(card)

}

function openService(s){

currentService=s

serviceTitle.innerText=s.title

serviceImage.src=s.image

serviceDesc.innerText=s.description

servicePrice.innerText=s.price+" €"

showSection("servicePage")

}

/* SEARCH */

window.searchServices=()=>{

const q=search.value.toLowerCase()

servicesList.innerHTML=""

servicesCache.forEach(s=>{

if(s.title.toLowerCase().includes(q)) createCard(s)

})

}

/* BOOKINGS */

window.bookService=async()=>{

await addDoc(collection(db,"bookings"),{

service:currentService.id,
user:auth.currentUser.uid,
time:Date.now()

})

alert("Prenotazione inviata")

}

/* CHAT */

window.sendMessage=async()=>{

await addDoc(collection(db,"messages"),{

service:currentService.id,
text:chatInput.value,
username:currentUsername

})

chatInput.value=""

}

onSnapshot(collection(db,"messages"),snap=>{

chatBox.innerHTML=""

snap.forEach(doc=>{

const m=doc.data()

if(currentService && m.service===currentService.id){

const div=document.createElement("div")

div.className="msg"

div.innerText=m.username+": "+m.text

chatBox.appendChild(div)

}

})

})

loadServices()

</script>

</body>
</html>

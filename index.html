<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>SafEnt Rental</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
background:radial-gradient(circle at bottom,#1a0033,#000);
}

/* sfondo stellato */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px,transparent 1px),
radial-gradient(white 1px,transparent 1px);
background-size:120px 120px,200px 200px;
opacity:0.35;
pointer-events:none;
}

/* header */

header{
background:#180030;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
display:flex;
align-items:center;
gap:10px;
font-size:20px;
font-weight:bold;
color:#d4b5ff;
}

.logo img{
height:35px;
}

/* menu */

nav button{
margin-left:10px;
}

/* layout */

.container{
max-width:1100px;
margin:auto;
padding:25px;
}

.section{
display:none;
}

.active{
display:block;
}

/* flashcards */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#240048;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:0.2s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.cardContent{
padding:15px;
}

/* form */

input,textarea{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:8px;
background:#1b0038;
color:white;
}

/* button */

button{
background:#7a2cff;
border:none;
padding:10px 15px;
border-radius:8px;
color:white;
cursor:pointer;
}

button:hover{
background:#9b59ff;
}

/* chat */

.chatBox{
height:260px;
overflow:auto;
background:#120028;
padding:10px;
border-radius:8px;
margin-bottom:10px;
}

.msg{
background:#5200b5;
padding:6px;
margin:5px 0;
border-radius:6px;
}

</style>

</head>

<body>

<header>

<div class="logo">

<img src="logo.png">
SafEnt Rental

</div>

<nav>

<button onclick="showSection('services')">Servizi</button>
<button onclick="showSection('publish')">Pubblica</button>
<button onclick="showSection('chat')">Chat</button>
<button onclick="showSection('account')">Account</button>

</nav>

</header>

<div class="container">

<!-- SERVICES -->

<div id="services" class="section active">

<h2>Servizi disponibili</h2>

<button onclick="loadServices()">Aggiorna</button>

<div class="grid" id="servicesList"></div>

</div>

<!-- PUBLISH -->

<div id="publish" class="section">

<h2>Pubblica servizio</h2>

<input id="title" placeholder="Titolo">

<textarea id="description" placeholder="Descrizione"></textarea>

<input id="price" placeholder="Prezzo">

<input id="location" placeholder="Città">

<input type="file" id="image">

<button onclick="createService()">Pubblica</button>

</div>

<!-- CHAT -->

<div id="chat" class="section">

<h2>Chat</h2>

<div class="chatBox" id="chatBox"></div>

<input id="chatInput" placeholder="Scrivi messaggio">

<button onclick="sendMessage()">Invia</button>

</div>

<!-- ACCOUNT -->

<div id="account" class="section">

<h2>Account</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>

<button onclick="login()">Login</button>

<button onclick="logout()">Logout</button>

<p id="userStatus"></p>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
where,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"

/* CONFIG FIREBASE */

const firebaseConfig={
  apiKey: "AIzaSyCysFp0BlVGQF6jlyJCv5J8e8k1AjXFNQ4",
  authDomain: "safent-rental.firebaseapp.com",
  databaseURL: "https://safent-rental-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "safent-rental",
  storageBucket: "safent-rental.firebasestorage.app",
  messagingSenderId: "739442300132",
  appId: "1:739442300132:web:cb5046398e0b4dc87c48f1",
  measurementId: "G-3DC7JE7EB3"
}

const app=initializeApp(firebaseConfig)

const auth=getAuth(app)

const db=getFirestore(app)

let currentChatUser=null

/* MENU */

window.showSection=(id)=>{

document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

/* AUTH */

window.register=async()=>{

await createUserWithEmailAndPassword(auth,email.value,password.value)

}

window.login=async()=>{

await signInWithEmailAndPassword(auth,email.value,password.value)

}

window.logout=()=>signOut(auth)

onAuthStateChanged(auth,user=>{

userStatus.innerText=user ? "Loggato: "+user.email : "Non loggato"

})

/* PUBBLICA SERVIZIO */

window.createService=async()=>{

if(!auth.currentUser){
alert("Login richiesto")
return
}

const file=image.files[0]

if(!file){
alert("Inserisci immagine")
return
}

if(file.size>1000000){
alert("immagine troppo grande")
return
}

const reader=new FileReader()

reader.onload=async function(){

await addDoc(collection(db,"services"),{

title:title.value,
description:description.value,
price:price.value,
location:location.value,
image:reader.result,
owner:auth.currentUser.uid

})

alert("Servizio pubblicato")

}

reader.readAsDataURL(file)

}

/* LOAD SERVICES */

window.loadServices=async()=>{

servicesList.innerHTML=""

const snap=await getDocs(collection(db,"services"))

snap.forEach(doc=>{

const s=doc.data()

const card=document.createElement("div")

card.className="card"

card.innerHTML=`

<img src="${s.image}">

<div class="cardContent">

<h3>${s.title}</h3>

<p>${s.location}</p>

<p>${s.price} €</p>

</div>

`

card.onclick=()=>{

currentChatUser=s.owner

showSection("chat")

loadChat()

}

servicesList.appendChild(card)

})

}

/* CHAT */

function loadChat(){

const q=query(collection(db,"messages"),where("to","==",currentChatUser))

onSnapshot(q,snap=>{

chatBox.innerHTML=""

snap.forEach(doc=>{

const m=doc.data()

const div=document.createElement("div")

div.className="msg"

div.innerText=m.text

chatBox.appendChild(div)

})

})

}

window.sendMessage=async()=>{

if(!auth.currentUser)return

await addDoc(collection(db,"messages"),{

text:chatInput.value,
from:auth.currentUser.uid,
to:currentChatUser,
time:Date.now()

})

chatInput.value=""

}

</script>

</body>
</html>

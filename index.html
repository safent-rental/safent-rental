<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>SafEnt Rental</title>

<style>

/* COSMIC BACKGROUND */

body{
font-family:Arial;
margin:0;
color:white;
background:radial-gradient(ellipse at bottom,#1b0033 0%,#000000 100%);
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background-image:
radial-gradient(white 1px,transparent 1px),
radial-gradient(white 1px,transparent 1px),
radial-gradient(white 2px,transparent 2px);

background-size:
100px 100px,
200px 200px,
300px 300px;

opacity:0.4;
pointer-events:none;
}

/* HEADER */

header{
background:rgba(25,0,45,0.9);
backdrop-filter:blur(10px);
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
border-bottom:1px solid rgba(160,120,255,0.3);
}

.logo{
color:#d6baff;
font-size:24px;
font-weight:bold;
}

/* MENU */

nav button{
margin-left:10px;
}

/* LAYOUT */

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

/* SECTIONS */

.section{
display:none;
}

.active{
display:block;
}

/* CARDS */

.card{
background:rgba(40,10,70,0.85);
border:1px solid rgba(180,120,255,0.3);
border-radius:12px;
padding:20px;
margin-bottom:15px;
box-shadow:0 0 20px rgba(130,70,255,0.2);
}

/* INPUT */

input,textarea{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:1px solid rgba(200,150,255,0.3);
background:rgba(30,0,50,0.7);
color:white;
}

/* BUTTON */

button{
background:linear-gradient(45deg,#6a00ff,#a259ff);
border:none;
color:white;
padding:10px 16px;
border-radius:8px;
cursor:pointer;
box-shadow:0 0 10px rgba(140,80,255,0.6);
transition:0.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px rgba(170,120,255,1);
}

/* MAP */

#map{
height:400px;
border-radius:10px;
border:2px solid rgba(180,120,255,0.4);
}

/* CHAT */

.chatBox{
height:200px;
overflow:auto;
background:rgba(20,0,40,0.8);
padding:10px;
border-radius:8px;
border:1px solid rgba(160,100,255,0.3);
}

.chatMsg{
background:rgba(80,30,150,0.7);
padding:8px;
margin:5px 0;
border-radius:6px;
}

</style>

</head>

<body>

<header>

<div class="logo">🌌 SafEnt Rental</div>

<nav>

<button onclick="openSection('home')">Home</button>
<button onclick="openSection('services')">Servizi</button>
<button onclick="openSection('publish')">Pubblica</button>
<button onclick="openSection('cartSection')">Carrello</button>
<button onclick="openSection('chatSection')">Chat</button>
<button onclick="openSection('account')">Account</button>

</nav>

</header>

<div class="container">

<!-- HOME -->

<div id="home" class="section active">

<div class="card">

<h3>Mappa servizi</h3>

<div id="map"></div>

</div>

</div>

<!-- SERVICES -->

<div id="services" class="section">

<div class="card">

<h3>Cerca servizi</h3>

<input id="radius" value="10">

<button onclick="loadServices()">Cerca</button>

</div>

<div id="servicesList"></div>

</div>

<!-- PUBLISH -->

<div id="publish" class="section">

<div class="card">

<h3>Pubblica servizio</h3>

<input id="title" placeholder="Titolo">

<textarea id="description" placeholder="Descrizione"></textarea>

<input id="price" placeholder="Prezzo">

<button onclick="createService()">Pubblica</button>

</div>

</div>

<!-- CART -->

<div id="cartSection" class="section">

<div class="card">

<h3>Carrello</h3>

<div id="cart"></div>

</div>

</div>

<!-- CHAT -->

<div id="chatSection" class="section">

<div class="card">

<h3>Chat pubblica</h3>

<div class="chatBox" id="chat"></div>

<input id="chatInput">

<button onclick="sendMessage()">Invia</button>

</div>

</div>

<!-- ACCOUNT -->

<div id="account" class="section">

<div class="card">

<h3>Account</h3>

<div id="authUI"></div>

<div id="userStatus"></div>

<button onclick="logout()">Logout</button>

</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"

import {
getFirestore,
collection,
addDoc,
getDocs,
onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"

/* FIREBASE CONFIG */

const firebaseConfig={
apiKey:"YOUR_KEY",
authDomain:"PROJECT.firebaseapp.com",
projectId:"PROJECT"
}

const app=initializeApp(firebaseConfig)
const auth=getAuth(app)
const db=getFirestore(app)

/* MENU */

window.openSection=(id)=>{

document.querySelectorAll(".section")
.forEach(s=>s.classList.remove("active"))

document.getElementById(id)
.classList.add("active")

}

/* AUTH UI */

authUI.innerHTML=`

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

`

window.register=async()=>{

await createUserWithEmailAndPassword(
auth,
email.value,
password.value
)

alert("Account creato")

}

window.login=async()=>{

await signInWithEmailAndPassword(
auth,
email.value,
password.value
)

}

window.logout=()=>signOut(auth)

onAuthStateChanged(auth,user=>{

if(user){
userStatus.innerHTML="Logged: "+user.email
}else{
userStatus.innerHTML="Not logged"
}

})

/* GEOLOCATION */

let userLocation=null

navigator.geolocation.getCurrentPosition(pos=>{

userLocation={
lat:pos.coords.latitude,
lng:pos.coords.longitude
}

initMap()

})

/* MAP */

let map

function initMap(){

map=new google.maps.Map(
document.getElementById("map"),
{
center:userLocation,
zoom:12
})

new google.maps.Marker({
position:userLocation,
map
})

}

/* CREATE SERVICE */

window.createService=async()=>{

if(!auth.currentUser){
alert("Devi fare login")
return
}

await addDoc(collection(db,"services"),{

title:title.value,
description:description.value,
price:price.value,
lat:userLocation.lat,
lng:userLocation.lng

})

alert("Servizio pubblicato")

}

/* DISTANCE */

function distance(lat1,lon1,lat2,lon2){

const R=6371

const dLat=(lat2-lat1)*Math.PI/180
const dLon=(lon2-lon1)*Math.PI/180

const a=
Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2

return R*(2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)))

}

/* SERVICES */

window.loadServices=async()=>{

servicesList.innerHTML=""

const snap=await getDocs(collection(db,"services"))

snap.forEach(doc=>{

const s=doc.data()

const d=distance(
userLocation.lat,
userLocation.lng,
s.lat,
s.lng
)

if(d>radius.value)return

const card=document.createElement("div")

card.className="card"

card.innerHTML=`

<h4>${s.title}</h4>
<p>${s.description}</p>
<p>${s.price} €</p>
<p>${d.toFixed(1)} km</p>

<button onclick='addCart(${JSON.stringify(s)})'>
Aggiungi carrello
</button>

`

servicesList.appendChild(card)

new google.maps.Marker({
position:{lat:s.lat,lng:s.lng},
map
})

})

}

/* CART */

let cart=[]

window.addCart=(s)=>{

cart.push(s)

cart.innerHTML=""

cart.forEach(item=>{

const div=document.createElement("div")

div.className="card"

div.innerText=item.title+" - "+item.price+"€"

document.getElementById("cart").appendChild(div)

})

}

/* CHAT */

window.sendMessage=async()=>{

if(!auth.currentUser)return

await addDoc(collection(db,"messages"),{

text:chatInput.value,
user:auth.currentUser.uid,
time:Date.now()

})

chatInput.value=""

}

onSnapshot(collection(db,"messages"),snap=>{

chat.innerHTML=""

snap.forEach(doc=>{

const m=doc.data()

const div=document.createElement("div")

div.className="chatMsg"

div.innerText=m.text

chat.appendChild(div)

})

})

</script>

<script async
src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAP_KEY&callback=initMap">
</script>

</body>
</html>
